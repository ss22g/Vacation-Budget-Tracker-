<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage | Vacation Budget Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css" type="text/css" media="all" />
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1><i class="fas fa-umbrella-beach btn-icon"></i> Voyage Budget Tracker</h1>
            <p>Plan your dream vacation without breaking the bank</p>
        </header>

        <div class="grid">
            <div class="card animation-float">
                <div class="card-header">
                    <h2><i class="fas fa-info-circle btn-icon"></i> Trip Details</h2>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="tripName">Trip Name</label>
                        <input type="text" id="tripName" class="form-control" placeholder="e.g., Summer Europe Adventure">
                    </div>
                    <div class="form-group">
                        <label for="tripDestination">Destination</label>
                        <input type="text" id="tripDestination" class="form-control" placeholder="e.g., Paris, France">
                    </div>
                    <div class="form-group">
                        <label for="tripDates">Travel Dates</label>
                        <input type="text" id="tripDates" class="form-control" placeholder="e.g., June 15 - June 30, 2023">
                    </div>
                    <div class="form-group">
                        <label for="tripDuration">Duration (days)</label>
                        <input type="number" id="tripDuration" class="form-control" min="1" value="7">
                    </div>
                </div>
            </div>

            <div class="card animation-float" style="animation-delay: 0.2s;">
                <div class="card-header">
                    <h2><i class="fas fa-wallet btn-icon"></i> Budget Summary</h2>
                </div>
                <div class="card-body">
                    <div class="total-display">
                        <div>
                            <h3>Total Estimated Budget</h3>
                            <div class="currency-selector">
                                <select id="currency" class="form-control" style="width: auto; padding: 0.5rem;">
                                    <option value="USD">USD ($)</option>
                                    <option value="EUR">EUR (€)</option>
                                    <option value="GBP">GBP (£)</option>
                                    <option value="JPY">JPY (¥)</option>
                                </select>
                                <span class="badge badge-primary" id="expenseCount">0 items</span>
                            </div>
                        </div>
                        <div class="total-amount" id="totalBudget">$0.00</div>
                    </div>
                    <div class="form-group" style="margin-top: 1.5rem;">
                        <label for="budgetLimit">Budget Limit (optional)</label>
                        <input type="number" id="budgetLimit" class="form-control" placeholder="Enter your maximum budget">
                    </div>
                    <div id="budgetProgress" style="height: 8px; background: #e9ecef; border-radius: 4px; margin-top: 0.5rem; overflow: hidden; display: none;">
                        <div id="progressBar" style="height: 100%; background: var(--success); width: 0%; transition: width 0.5s ease;"></div>
                    </div>
                    <div id="budgetMessage" style="margin-top: 0.5rem; font-size: 0.9rem;"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-receipt btn-icon"></i> Expense Tracker</h2>
                <button id="addExpense" class="btn btn-primary">
                    <i class="fas fa-plus btn-icon"></i> Add Expense
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table id="expenseTable">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Description</th>
                                <th>Date</th>
                                <th>Amount</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTableBody">
                            <tr class="empty-state-row">
                                <td colspan="5">
                                    <div class="empty-state">
                                        <i class="fas fa-receipt"></i>
                                        <h3>No expenses added yet</h3>
                                        <p>Start by adding your first expense item</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Expense added successfully!</span>
    </div>

    <div class="spinner" id="loadingSpinner"></div>

    <script src="script.js"></script>
</body>
</html>
